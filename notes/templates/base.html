<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sticky Notes App{% endblock %}</title>
    
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    
    <!-- Global Custom Tweaks (e.g., matching the app's background) -->
    <style>
        body { background-color: #f8f9fa; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- Responsive Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fs-4" href="{% url 'notes:note_list' %}">📌 StickyBoard</a>
            <div class="ms-auto">
                <a class="btn btn-warning fw-bold shadow-sm" href="{% url 'notes:note_create' %}">
                    <i class="bi bi-plus-lg"></i> ➕ New Note
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container my-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center py-4 mt-5 border-top text-muted">
        <p>&copy; {% now "Y" %} StickyBoard App</p>
    </footer>

    <!-- Bootstrap 5 JavaScript Bundle CDN -->
    <script src="https://jsdelivr.net"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
