{% extends 'base.html' %}

{% block title %}{{ note.title }}{% endblock %}

{% block extra_css %}
<style>
    .detail-note-card {
        background-color: #ffc499 !important; /* Highlight Orange/Peach for Detail View */
        border: none !important;
        border-bottom-right-radius: 40px !important;
        box-shadow: 8px 8px 20px rgba(0, 0, 0, 0.12);
    }
</style>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        
        <!-- Main Sticky Note Card -->
        <div class="card detail-note-card p-4 mb-4">
            <div class="card-body">
                <h2 class="card-title fw-bold border-bottom pb-3 text-dark">{{ note.title }}</h2>
                <p class="card-text fs-5 text-dark my-4 style-text" style="white-space: pre-wrap;">{{ note.content }}</p>
                <p class="text-muted small mb-0">Last updated: {{ note.updated_at|date:"d M Y, H:i" }}</p>
            </div>
        </div>

        <!-- Action Control Bar using Bootstrap flex utilities -->
        <div class="d-flex justify-content-between gap-2">
            <a href="{% url 'sticky_notes:note_list' %}" class="btn btn-outline-secondary px-4 shadow-sm">
                ⬅️ Back to Board
            </a>
            <div class="d-flex gap-2">
                <a href="{% url 'sticky_notes:note_edit' note.id %}" class="btn btn-primary px-4 shadow-sm">
                    ✏️ Edit
                </a>
                <a href="{% url 'sticky_notes:note_delete' note.id %}" class="btn btn-danger px-4 shadow-sm">
                    🗑️ Delete
                </a>
            </div>
        </div>

    </div>
</div>
{% endblock %}
